name: Destroy AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

    steps:
      - name: Guard branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/cloud/aws" ]; then
            echo "This workflow may only run from refs/heads/cloud/aws; got ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      # The archive_file data sources have to resolve even for a destroy plan,
      # so the staging directories must exist. Contents are irrelevant here.
      - name: Package Lambda functions
        run: scripts/build_package.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=aerofeed/cloud-aws.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform destroy plan
        run: terraform -chdir=terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform destroy apply
        run: terraform -chdir=terraform apply -input=false -auto-approve destroy.tfplan

      - name: Delete leftover Lambda log groups
        run: |
          for group in $(aws logs describe-log-groups \
            --region "$AWS_REGION" \
            --log-group-name-prefix /aws/lambda/aerofeed \
            --query 'logGroups[].logGroupName' \
            --output text); do
            aws logs delete-log-group --region "$AWS_REGION" --log-group-name "$group"
          done

      # The repository page keeps showing the production environment and its
      # site URL until the deployment records are gone. GitHub refuses to delete
      # an active deployment, so each one is marked inactive first.
      - name: Clear GitHub deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh api --paginate "repos/$REPO/deployments?environment=production" --jq '.[].id'); do
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive --silent
            gh api -X DELETE "repos/$REPO/deployments/$id" --silent
            echo "deleted deployment $id"
          done

      - name: Destroy summary
        run: |
          {
            echo "## Aerofeed destroy"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Terraform destroy completed."
            echo "- Leftover \`/aws/lambda/aerofeed*\` log groups deleted."
          } >> "$GITHUB_STEP_SUMMARY"
