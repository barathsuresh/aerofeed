<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aerofeed — live aircraft</title>

<!-- Leaflet from CDN, no build step. SRI hashes computed from the actual
     1.9.4 bytes; a tampered CDN response fails closed rather than executing. -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous">
<script defer
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
        crossorigin="anonymous"></script>
<script defer src="app.js"></script>

<style>
  :root {
    --bg: #0f1419;
    --panel: rgba(18, 24, 31, 0.92);
    --text: #e6edf3;
    --muted: #8b949e;
    --live: #3fb950;
    --down: #f85149;
    --pending: #d29922;
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Map fills the viewport; everything else floats over it. */
  #map { position: absolute; inset: 0; background: var(--bg); }

  #hud {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 1000;              /* above Leaflet panes */
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 14px;
    min-width: 190px;
    backdrop-filter: blur(6px);
  }

  #hud h1 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  #count { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #count span { font-size: 13px; font-weight: 400; color: var(--muted); }

  #status { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pending); flex: none; }
  #dot.live { background: var(--live); }
  #dot.down { background: var(--down); }
  /* Pulse only while live, so a frozen feed is visually obvious. */
  #dot.live { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  #cell { margin-top: 6px; font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  /* Coverage capped: the viewport is wider than the cells being polled. */
  #cell.capped { color: var(--pending); }

  /* Plane marker: an SVG pointing north, rotated to the reported heading. */
  .plane { width: 22px; height: 22px; transition: transform 0.4s linear; }
  .plane svg { width: 100%; height: 100%; display: block; }
  .plane.air svg   { fill: #58a6ff; stroke: #0d1117; stroke-width: 12; }
  .plane.ground svg { fill: #8b949e; stroke: #0d1117; stroke-width: 12; }
  .plane.military svg { fill: #3fb950; }

  /* Position provenance. A stale or estimated fix must never look like a live
     one — these aircraft are real but their coordinates are not current. */
  .plane.stale     { opacity: 0.55; }
  .plane.stale svg { fill: #d29922; stroke-dasharray: 20 10; }
  .plane.estimated     { opacity: 0.4; }
  .plane.estimated svg { fill: #8b949e; stroke: #d29922; }

  /* Outranks every other styling: fill plus a pulse that survives at a glance
     across a crowded map. The animation is on the svg, not the wrapper — the
     wrapper's transform carries the heading rotation and must not be clobbered. */
  .plane.emergency { opacity: 1; }
  .plane.emergency svg {
    fill: #f85149 !important;
    transform-origin: center;
    /* Distinct name: `pulse` is already taken by the status dot above, and a
       duplicate @keyframes silently replaces it for every user of that name. */
    animation: emergency-pulse 1s ease-in-out infinite;
  }
  @keyframes emergency-pulse { 50% { transform: scale(1.45); } }

  .badge {
    display: inline-block; padding: 1px 6px; margin-left: 4px;
    border-radius: 3px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; vertical-align: middle;
  }
  .badge.mil  { background: #1a4d2e; color: #3fb950; }
  .badge.warn { background: #4d3800; color: #d29922; }
  .badge.stop { background: #5c1d1a; color: #f85149; }

  .leaflet-popup-content .sub  { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .leaflet-popup-content .warn {
    color: #d29922; font-size: 11px; margin-top: 4px;
    padding: 3px 6px; background: rgba(210, 153, 34, 0.12); border-radius: 3px;
  }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #161b22; color: var(--text); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
  .leaflet-popup-content b { font-size: 15px; }
  .leaflet-popup-content table { border-spacing: 0; margin-top: 6px; }
  .leaflet-popup-content td { padding: 1px 0; }
  .leaflet-popup-content td:first-child { color: var(--muted); padding-right: 12px; }
</style>
</head>
<body>
  <div id="map"></div>

  <div id="hud">
    <h1>aerofeed</h1>
    <div id="count">0 <span>aircraft tracked</span></div>
    <div id="status"><span id="dot"></span><span id="status-text">connecting…</span></div>
    <div id="cell">cell —</div>
  </div>
</body>
</html>
